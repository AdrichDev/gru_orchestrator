model_instructions_file = 'D:\Adrian\10. IA\Gru-Orchestrator\.codex\engram-instructions.md'
experimental_compact_prompt_file = 'D:\Adrian\10. IA\Gru-Orchestrator\.codex\engram-compact-prompt.md'

[features]
multi_agent = true

[agents]
max_depth = 2
max_threads = 4

[mcp_servers.engram]
command = "engram"
args = [
    "mcp",
    "--tools=agent",
]

[mcp_servers.caveman-shrink]
command = "npx"
args = [
    "-y",
    "caveman-shrink",
]

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "--package=@upstash/context7-mcp@2.2.5",
    "--",
    "context7-mcp",
]

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
